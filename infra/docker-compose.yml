# Local training environment: RabbitMQ, Azure Service Bus emulator, SQL Server (shared by the emulator and the demos).
# Telemetry goes to Application Insights (src/M4.ReliableOrders/setup.sh).
services:
  rabbitmq:
    image: rabbitmq:4-management          # pin the exact 4.x version you validated
    ports:
      - "5673:5672"                       # 5672 is taken by the Service Bus emulator
      - "15673:15672"                     # management UI: http://localhost:15673 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Training#2026"
    ports:
      - "1433:1433"

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    depends_on: [sqlserver]
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: sqlserver
      MSSQL_SA_PASSWORD: "Training#2026"
      ACCEPT_EULA: "Y"
    ports:
      - "5672:5672"                       # AMQP
      - "5300:5300"                       # management / health (http://localhost:5300/health)
