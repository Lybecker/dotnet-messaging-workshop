# ─────────────────────────────────────────────────────────────────────────────
# RabbitMQ Messaging Topology Operator: topology as Kubernetes objects.
# kubectl apply  -> created.   kubectl delete / remove from GitOps -> deleted.
#
# Option A: broker run by the RabbitMQ Cluster Operator in the same cluster
#           -> rabbitmqClusterReference.name
# Option B: ANY RabbitMQ (self-hosted on VMs, or managed e.g. CloudAMQP)
#           -> rabbitmqClusterReference.connectionSecret (see bottom)
# ─────────────────────────────────────────────────────────────────────────────

# ── Owned by the ORDERS team ────────────────────────────────────────────────
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: orders-order-placed-v1
spec:
  name: orders.order-placed.v1
  vhost: contoso
  type: topic
  durable: true
  rabbitmqClusterReference:
    name: contoso-bus              # Option A
---
# ── Owned by the BILLING team ───────────────────────────────────────────────
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: billing-order-placed
spec:
  name: billing.order-placed
  vhost: contoso
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: contoso-bus
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: billing-order-placed-dlq
spec:
  name: billing.order-placed.dlq
  vhost: contoso
  type: quorum
  durable: true
  rabbitmqClusterReference:
    name: contoso-bus
---
apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: billing-order-placed-defaults
spec:
  name: billing.order-placed.defaults
  vhost: contoso
  pattern: "^billing\\.order-placed$"
  applyTo: queues
  priority: 10
  definition:
    dead-letter-exchange: ""
    dead-letter-routing-key: billing.order-placed.dlq
    delivery-limit: 10
    message-ttl: 1209600000        # 14 days
  rabbitmqClusterReference:
    name: contoso-bus
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: orders-order-placed-to-billing
spec:
  vhost: contoso
  source: orders.order-placed.v1
  destination: billing.order-placed
  destinationType: queue
  routingKey: "#"
  rabbitmqClusterReference:
    name: contoso-bus
---
# Data plane for the app: read/write its own objects, configure nothing.
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: billing-permissions
spec:
  vhost: contoso
  user: billing
  permissions:
    configure: "^$"
    write: "^billing\\."
    read: "^billing\\."
  rabbitmqClusterReference:
    name: contoso-bus
---
# ── Option B: external or managed broker ────────────────────────────────────
# Replace every  rabbitmqClusterReference: { name: contoso-bus }  with:
#
#   rabbitmqClusterReference:
#     connectionSecret:
#       name: cloudamqp-prod
#
# and create the secret (pipeline user with configure rights):
apiVersion: v1
kind: Secret
metadata:
  name: cloudamqp-prod
  labels:
    rabbitmq.com/topology-operator: "true"   # required by recent operator versions
type: Opaque
stringData:
  uri: https://contoso-bus-prod.rmq.cloudamqp.com   # management API
  username: pipeline
  password: <from Key Vault / external-secrets>
